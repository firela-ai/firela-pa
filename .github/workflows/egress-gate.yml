name: egress-gate
on:
  push:
    paths: ['pc/**', 'ci/egress-gate.py']
  pull_request:
    paths: ['pc/**', 'ci/egress-gate.py']

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: egress 单点门禁（含反例自证）
        run: |
          python3 ci/egress-gate.py --self-test
          python3 ci/egress-gate.py
